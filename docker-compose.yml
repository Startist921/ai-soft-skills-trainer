services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - '8087:8087'
    environment:
      - SBER_AUTH=${SBER_AUTH:-}
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: 8080
      DAILY_TRAINING_LIMIT: 5
      ML_SERVICE_URL: http://ml-service:8087
      MODEL_NAME: GigaChat
      MAX_NEW_TOKENS: 120
      TEMPERATURE: 0.55
      TOP_P: 0.85
    ports:
      - '8080:8080'
    depends_on:
      - ml-service
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped
