services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=softskills
      - POSTGRES_USER=softskills
      - POSTGRES_PASSWORD=softskills
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - '8087:8087'
    environment:
      - SBER_AUTH=${SBER_AUTH:-}
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      DAILY_TRAINING_LIMIT: 5
      ML_SERVICE_URL: http://ml-service:8087
      MODEL_NAME: GigaChat
      DATABASE_URL: postgres://softskills:softskills@postgres:5432/softskills?sslmode=disable
      MAX_NEW_TOKENS: 120
      TEMPERATURE: 0.55
      TOP_P: 0.85
    ports:
      - '8080:8080'
    depends_on:
      - postgres
      - ml-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
